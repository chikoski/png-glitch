[workspace]
members = [".", "crates/*"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["N.Shimizu <chikoski@gmail.com>"]
license = "MIT"
repository = "https://github.com/chikoski/png-glitch"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.18", features = ["derive"] }
crc32fast = "1.5.0"
fdeflate = "0.3.7"
glitch-context = { path = "crates/glitch-context", version = "0.2.0" }
image = "0.25.10"
indicatif = "0.18"
log = "0.4.22"
png-glitch = { path = "crates/png-glitch", version = "0.7.0" }
rand = "0.9.2"
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2.0.17"
walkdir = "2.5"
webp = "0.3.1"
webp-glitch = { path = "crates/webp-glitch", version = "0.1.0" }

[package]
name = "png-glitch-cli"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "CLI tool to glitch PNG and WebP images."
license.workspace = true
readme = "README.md"
repository.workspace = true

[[bin]]
name = "png-glitch"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
png-glitch.workspace = true
glitch-context.workspace = true
webp-glitch.workspace = true
rand.workspace = true
log.workspace = true
serde.workspace = true
walkdir.workspace = true
indicatif.workspace = true
rayon.workspace = true
serde_yaml_ng.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
blake3 = "1.8.7"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
