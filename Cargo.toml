[package]
name = "png-glitch-cli"
version = "0.4.1"
edition = "2024"
authors = ["N.Shimizu <chikoski@gmail.com>"]
description = "Cli to glitch PNG images."
license = "MIT"
readme = "README.md"
repository = "https://github.com/chikoski/png-glitch"

[[bin]]
name = "png-glitch"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.89", features = [] }
clap = { version = "4.5.18", features = ["derive"] }
png-glitch = { path = "crates/png-glitch", version = "0.6.0" }
glitch-context = { path = "crates/glitch-context", version = "0.1.0" }
rand = "0.9.2"
log = "0.4.22"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
walkdir = "2.5"
indicatif = "0.17"
