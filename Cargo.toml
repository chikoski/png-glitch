[workspace]
members = [".", "crates/*"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
authors = ["N.Shimizu <chikoski@gmail.com>"]
license = "MIT"
repository = "https://github.com/chikoski/png-glitch"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.18", features = ["derive"] }
crc32fast = "1.5.0"
fdeflate = "0.3.7"
png-glitch-recipe = { path = "crates/png-glitch-recipe", version = "0.3.0" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
indicatif = "0.18"
log = "0.4.22"
png-glitch = { path = "crates/png-glitch", version = "0.7.0", default-features = false }
rand = { version = "0.9.2", default-features = false }
rand_chacha = { version = "0.9.0", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2.1"
thiserror = "2.0.17"
walkdir = "2.5"
webp = "0.3.1"
webp-glitch = { path = "crates/webp-glitch", version = "0.1.0" }
webp-glitch-context = { path = "crates/webp-glitch-context", version = "0.1.0" }

[profile.release]
# The CLI ships in release mode; keep arithmetic overflow checks on so bugs are not silently wrapped.
overflow-checks = true

[package]
name = "png-glitch-cli"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "CLI tool to glitch PNG and WebP images."
license.workspace = true
readme = "README.md"
repository.workspace = true

[[bin]]
name = "png-glitch"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
png-glitch = { workspace = true, features = ["parallel"] }
png-glitch-recipe.workspace = true
crc32fast.workspace = true
webp-glitch-context.workspace = true
rand = { workspace = true, features = ["default"] }
log.workspace = true
serde.workspace = true
walkdir.workspace = true
indicatif.workspace = true
rayon.workspace = true
serde-saphyr.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
blake3 = "1.8.7"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
