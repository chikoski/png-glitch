[package]
name = "png-glitch-component"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "png-glitch as a WebAssembly component (WASI 0.2 / WIT): stateless PNG in, PNG out."
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
# `cdylib` is the component on wasm32-wasip2; `rlib` lets the native tests link the logic.
crate-type = ["cdylib", "rlib"]

[dependencies]
png-glitch = { path = "../png-glitch", version = "0.7.0", default-features = false }
png-glitch-recipe = { path = "../png-glitch-recipe", version = "0.3.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[dev-dependencies]
image.workspace = true
