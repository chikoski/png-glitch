[package]
name = "png-glitch-component-host-test"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs the built png-glitch component with wasmtime and compares it with the CLI."

# A nested package: it is excluded from the root workspace (see the root Cargo.toml).
[workspace]

[dependencies]
wasmtime = { version = "38", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "gc-drc"] }
wasmtime-wasi = "38"
anyhow = "1"
