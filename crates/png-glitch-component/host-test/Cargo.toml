[package]
name = "png-glitch-component-host-test"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs the built png-glitch component with wasmtime and compares it with the CLI."

# A nested package: it is excluded from the root workspace (and its 1.89 MSRV; wasmtime 43 requires Rust 1.91 and CI tests it on stable).
[workspace]

[dependencies]
wasmtime = { version = "43", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "gc-drc"] }
wasmtime-wasi = "43"

[dev-dependencies]
png-glitch-component = { path = ".." }
