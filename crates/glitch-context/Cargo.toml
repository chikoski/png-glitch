[package]
name = "glitch-context"
version = "0.1.0"
edition = "2024"
authors = ["N.Shimizu <chikoski@gmail.com>"]
description = "A library to manage and apply glitch filters to PNG images."
license = "MIT"
repository = "https://github.com/chikoski/png-glitch"
readme = "README.md"

[dependencies]
png-glitch = { path = "../png-glitch", version = "0.6.0" }
anyhow = "1.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
webp-glitch = { version = "0.1.0", path = "../webp-glitch" }
