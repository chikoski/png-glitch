[package]
name = "glitch-context"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A library to manage and apply glitch filters to PNG images."
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
png-glitch.workspace = true
anyhow.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
clap = { workspace = true, optional = true }
webp-glitch = { workspace = true, optional = true }

[features]
default = ["webp", "clap"]
webp = ["dep:webp-glitch"]
clap = ["dep:clap"]
