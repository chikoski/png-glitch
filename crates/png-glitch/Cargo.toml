[package]
name = "png-glitch"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A library to glitch PNG images."
license.workspace = true
readme = "README.md"
repository.workspace = true

[dependencies]
crc32fast.workspace = true
fdeflate.workspace = true
rayon = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
image.workspace = true
# `fork` and `timeout` are not used, and their `wait-timeout` dependency does not build for
# `wasm32-wasip1`, where the filter kernels are tested too.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
png = "0.18.1"

[features]
default = ["parallel"]
# Runs `par_foreach_scanline` on a rayon thread pool. Without it the same API runs sequentially.
parallel = ["dep:rayon"]
