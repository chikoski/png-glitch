name: Benchmarks

# Builds the base commit and the PR head in the same job and runs them alternately, so the
# comparison uses the same runner instead of a stored baseline. Absolute numbers from shared
# runners are not comparable with the reference devices; only the base/head ratio is meaningful.
# This workflow is not part of the required `test` job.

on:
  pull_request:
    paths: ["crates/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The real-time budget (#99) is single-threaded.
  RAYON_NUM_THREADS: "1"
  # p50 regression that fails the job. Tune after a few runs.
  THRESHOLD: "0.25"
  NATIVE_ARGS: "--size 1080p --frames 30"
  WASM_ARGS: "--size 720p --frames 20"
  BROWSER_ARGS: "--size 1080p --frames 120 --warmup 10 --browser-channel chrome"

jobs:
  bench:
    name: Native and wasmtime
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        path: head
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1
    - uses: bytecodealliance/actions/wasmtime/setup@v1
    - name: Check out the base commit with the head's harness
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      run: |
        git -C head worktree add --detach ../base "$BASE_SHA"
        # Measure both sides with the same harness; only the library differs. (The base may
        # predate the bench crate.)
        rm -rf base/crates/png-glitch-bench
        cp -r head/crates/png-glitch-bench base/crates/png-glitch-bench
        echo "BASE_COMMIT=$(git -C head rev-parse "$BASE_SHA")" >> "$GITHUB_ENV"
        echo "HEAD_COMMIT=$(git -C head rev-parse HEAD)" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          head
          base

    - name: Build (native)
      run: |
        for side in base head; do
          cargo build --release -p png-glitch-bench --manifest-path "$side/Cargo.toml"
        done

    - name: Build (wasm32-wasip1, simd128)
      env:
        RUSTFLAGS: "-C target-feature=+simd128"
      run: |
        for side in base head; do
          cargo build --release -p png-glitch-bench --target wasm32-wasip1 --manifest-path "$side/Cargo.toml"
        done

    - name: Run (native, base and head alternately)
      run: |
        mkdir -p out
        for round in 1 2; do
          for side in base head; do
            commit=$([ "$side" = base ] && echo "$BASE_COMMIT" || echo "$HEAD_COMMIT")
            BENCH_GIT_COMMIT="$commit" "$side/target/release/png-glitch-bench" \
              $NATIVE_ARGS --json "out/native-$side-$round.json"
          done
        done

    - name: Run (wasmtime, base and head alternately)
      run: |
        for round in 1 2; do
          for side in base head; do
            commit=$([ "$side" = base ] && echo "$BASE_COMMIT" || echo "$HEAD_COMMIT")
            wasmtime run --dir . --env RAYON_NUM_THREADS --env "BENCH_GIT_COMMIT=$commit" \
              "$side/target/wasm32-wasip1/release/png-glitch-bench.wasm" \
              $WASM_ARGS --json "out/wasm-$side-$round.json"
          done
        done

    - name: Compare (native)
      run: |
        head/target/release/png-glitch-bench compare \
          out/native-base-1.json,out/native-base-2.json \
          out/native-head-1.json,out/native-head-2.json \
          --threshold "$THRESHOLD" | tee out/native-compare.txt
        exit "${PIPESTATUS[0]}"

    - name: Compare (wasmtime)
      if: ${{ !cancelled() }}
      run: |
        head/target/release/png-glitch-bench compare \
          out/wasm-base-1.json,out/wasm-base-2.json \
          out/wasm-head-1.json,out/wasm-head-2.json \
          --threshold "$THRESHOLD" | tee out/wasm-compare.txt
        exit "${PIPESTATUS[0]}"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bench-report
        path: out

  browser:
    name: Browser (headless Chrome)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        path: head
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip2
    - name: Check out the base commit
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      run: |
        git -C head worktree add --detach ../base "$BASE_SHA"
        echo "BASE_COMMIT=$(git -C head rev-parse "$BASE_SHA")" >> "$GITHUB_ENV"
        echo "HEAD_COMMIT=$(git -C head rev-parse HEAD)" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          head
          base
    - name: Install the harness
      working-directory: head/bench/browser
      run: npm ci
    - name: Check the JavaScript frame generator against the Rust one
      working-directory: head/bench/browser
      run: npm test
    - name: Build the component (head)
      working-directory: head/bench/browser
      run: node build.mjs --repo ../../../head --out dist
    # The base may predate the component or its `live` interface (the harness needs both): then
    # there is nothing to compare against, and the job only reports the head's numbers.
    - name: Build the component (base, if it has the live interface)
      working-directory: head/bench/browser
      run: |
        if grep -qs "interface live" ../../../base/crates/png-glitch-component/wit/world.wit; then
          node build.mjs --repo ../../../base --out dist-base
          echo "HAS_BASE=true" >> "$GITHUB_ENV"
        else
          echo "The base has no png-glitch-component with a live interface; skipping the comparison."
        fi
    - name: Decoder equivalence in Chrome
      working-directory: head/bench/browser
      run: npm run equivalence -- --browser-channel chrome
    - name: Run (head, then base, alternately)
      working-directory: head/bench/browser
      run: |
        mkdir -p out
        for round in 1 2; do
          npm run bench --silent -- $BROWSER_ARGS --commit "$HEAD_COMMIT" --json "out/browser-head-$round.json"
          if [ "$HAS_BASE" = true ]; then
            npm run bench --silent -- $BROWSER_ARGS --dist dist-base --commit "$BASE_COMMIT" --json "out/browser-base-$round.json"
          fi
        done
    - name: Compare
      if: ${{ env.HAS_BASE == 'true' }}
      working-directory: head
      run: |
        cargo build --release -p png-glitch-bench
        target/release/png-glitch-bench compare \
          bench/browser/out/browser-base-1.json,bench/browser/out/browser-base-2.json \
          bench/browser/out/browser-head-1.json,bench/browser/out/browser-head-2.json \
          --threshold "$THRESHOLD" | tee bench/browser/out/browser-compare.txt
        exit "${PIPESTATUS[0]}"
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        # A second job cannot add to `bench-report` (artifacts are immutable per name).
        name: bench-report-browser
        path: head/bench/browser/out
