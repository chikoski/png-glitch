name: Fuzz

on:
  schedule:
    # Daily at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "300"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - png_parse
          - png_glitch_ops
          - glitch_context_pipeline
          - webp_pipeline
          - webp_riff

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@nightly
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz

    - name: Restore corpus
      uses: actions/cache/restore@v6
      with:
        path: fuzz/corpus/${{ matrix.target }}
        key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: fuzz-corpus-${{ matrix.target }}-

    - name: Seed corpus (repo samples + PngSuite)
      run: fuzz/scripts/seed-corpus.sh --download-pngsuite

    - name: Build
      working-directory: fuzz
      run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu ${{ matrix.target }}

    - name: Fuzz
      working-directory: fuzz
      env:
        SECONDS_TO_RUN: ${{ github.event.inputs.seconds || '300' }}
      run: >
        cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
        -max_total_time="$SECONDS_TO_RUN"
        -rss_limit_mb=2048
        -timeout=30

    - name: Minimize corpus
      if: success()
      working-directory: fuzz
      run: cargo +nightly fuzz cmin --target x86_64-unknown-linux-gnu ${{ matrix.target }}

    - name: Save corpus
      if: always()
      uses: actions/cache/save@v6
      with:
        path: fuzz/corpus/${{ matrix.target }}
        key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

    - name: Upload crashes
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-artifacts-${{ matrix.target }}
        path: fuzz/artifacts/${{ matrix.target }}
        if-no-files-found: ignore
