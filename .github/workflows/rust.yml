name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly, so newly published advisories fail the build.
    - cron: "23 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Check documentation
      run: cargo doc --workspace --no-deps

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --workspace --all-targets --verbose
    - name: Run tests
      run: cargo test --workspace --all-targets --verbose
    - name: Run tests (release, overflow checks on)
      run: cargo test --workspace --release --verbose
    - name: Run doc tests
      run: cargo test --workspace --doc --verbose

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # Keep this version in sync with `rust-version` in the root Cargo.toml.
    - uses: dtolnay/rust-toolchain@1.89
    - name: Check workspace with the minimum supported Rust version
      run: cargo check --workspace

  fuzz-build:
    name: Build fuzz targets
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@nightly
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz
    - name: Build fuzz targets
      working-directory: fuzz
      run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    - name: Run cargo audit
      run: cargo audit --deny warnings
